name: OTA Update — Staging

on:
  push:
    branches: [main, master]
    paths:
      - "apps/app/src/**"
      - "packages/**"

jobs:
  ota-staging:
    name: Publish OTA to Staging (Preview)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update to preview channel
        working-directory: apps/app
        env:
          EXPO_PUBLIC_APP_VARIANT: staging
        run: eas update --channel preview --message "Auto staging: ${{ github.event.head_commit.message }}" --non-interactive
