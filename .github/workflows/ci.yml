name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/bun.lockb') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/bun.lockb') }}-
            turbo-${{ runner.os }}-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            node_modules-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Turbo SCM range
        id: turbo-range
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="origin/${{ github.base_ref }}"
            git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
            BASE="$BASE_REF"
          else
            BASE="${{ github.event.before }}"
            if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi
          fi

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Lint (affected)
        env:
          TURBO_SCM_BASE: ${{ steps.turbo-range.outputs.base }}
          TURBO_SCM_HEAD: ${{ steps.turbo-range.outputs.head }}
        run: bunx turbo run lint --affected

      - name: Typecheck (affected)
        env:
          TURBO_SCM_BASE: ${{ steps.turbo-range.outputs.base }}
          TURBO_SCM_HEAD: ${{ steps.turbo-range.outputs.head }}
        run: bunx turbo run check-types --affected

      - name: Test (affected)
        env:
          TURBO_SCM_BASE: ${{ steps.turbo-range.outputs.base }}
          TURBO_SCM_HEAD: ${{ steps.turbo-range.outputs.head }}
        run: bunx turbo run test --affected
